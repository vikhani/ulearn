spring.application.name=ulearn-backend
server.port=8080

spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/ulearn}
spring.datasource.username=${DB_USERNAME:ulearn}
spring.datasource.password=${DB_PASSWORD:ulearn}

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.jdbc.time_zone=UTC

spring.flyway.enabled=true

# External configuration (see .env.example and docs/development.md).
# Empty defaults make the app fail fast at startup when a value is missing.
ulearn.youtube.api-key=${YOUTUBE_API_KEY:}
ulearn.bootstrap.username=${BOOTSTRAP_USERNAME:}
ulearn.bootstrap.password=${BOOTSTRAP_PASSWORD:}
ulearn.catalog.freshness-threshold=${CATALOG_FRESHNESS_THRESHOLD:PT168H}
ulearn.progress.completion-threshold=${PROGRESS_COMPLETION_THRESHOLD:0.95}

management.endpoints.web.base-path=/
management.endpoints.web.exposure.include=health,info
management.endpoint.health.probes.enabled=true
